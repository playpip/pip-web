allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides, forcing patched versions of transitively-pulled packages
# flagged by `pnpm audit --audit-level=high`. Revisit when the parent deps
# (next -> sharp/postcss, shadcn -> everything else) ship the fixes themselves.
#
# Every entry below the first three arrives through `shadcn`, which is a
# dependency only because `globals.css` does `@import "shadcn/tailwind.css"`.
# None of it reaches a browser: the vulnerable packages are its CLI machinery
# (ts-morph, dotenvx, the MCP SDK) and the CSS import never touches them. They
# are pinned anyway because `test:all` runs in the deploy pipeline, so a high
# advisory here stops a release whether or not it can hurt a player.
#
# Bumping shadcn does not fix these. 4.16.1 was tried and carries the same four.
overrides:
  fast-uri: '>=3.1.6 <4' # GHSA-x6y7-cw3q-r55c, -5jgf-p345-68v8, -f65p-4m7j-42xc, -fph4-wmhf-6fwf, -jqff-g426-hqxp (host confusion, SSRF); stay on ajv's 3.x line
  sharp: '>=0.35.4' # libvips CVEs, now GHSA-g89c-p67h-r497 / -2jg2-4ch7-h545 / -rgj7-g3m4-5g8c; unused at runtime under static export
  postcss: '>=8.5.12' # GHSA-6g55-p6wh-862q (arbitrary file read); next pins 8.4.31
  undici: '>=7.29.0' # GHSA-c96p-vxvm-v55g (cross-user disclosure); via dotenvx
  ip-address: '>=10.3.1' # GHSA-mwp4-54f8-5fhr (SSRF via octal octets); via the MCP SDK
  brace-expansion: '>=5.0.9' # GHSA-rgw5-rvv9-x895 (DoS); only the 5.x line is here
  browserslist: '>=4.28.7' # GHSA-73wf-gq98-2v4g + unbounded cache growth; build-time only, via next and shadcn
  tar: '>=7.5.21' # GHSA-r292-9mhp-454m (stack-overflow DoS); via ava, not shadcn
  # GHSA-2883-xcg3-v3hh (DoS on merge keys), and it arrives on both major lines:
  # 3.x through ava -> supertap, 4.x through shadcn -> cosmiconfig. Two ranges
  # rather than one, so supertap is not dragged across a major.
  # Both ranges are capped: unbounded, pnpm takes the highest published version
  # and drags supertap from 3.x onto 4.x, which is a breaking API change in a
  # package AVA reports through.
  js-yaml@3: '>=3.15.2 <4'
  js-yaml@4: '>=4.3.2 <5'
  smol-toml: '>=1.7.1' # GHSA-7w5x-hrqm-74c2 (DoS on malformed TOML); knip's config reader, build-time only
