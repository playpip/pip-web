schema = 1
name = "Pip"

[runtime]
kind = "node"
version = "24"
package_manager = "pnpm"

[[setup.steps]]
kind = "dependencies"
locked = true

[[setup.steps]]
run = ["pnpm", "run", "build"]

[launch]
command = ["pnpm", "run", "dev", "--hostname", "{host}", "--port", "{port}"]
host = "127.0.0.1"
port = 3000

[health]
type = "http"
path = "/game"
timeout_seconds = 90

# Browser storage is scoped to the browser profile and origin, outside this checkout.
[persistence]
paths = []
